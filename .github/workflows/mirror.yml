name: Mirror to Gitee & GitCode

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        continue-on-error: true
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/nutou123/pandastocksdk.git
          git push --mirror gitee

      - name: Mirror to GitCode
        continue-on-error: true
        run: |
          git remote add gitcode https://${{ secrets.GITCODE_TOKEN }}@gitcode.net/<你的GITCODE用户名>/pandastocksdk.git
          git push --mirror gitcode
